name: Build mod

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve newest NeoForge 21.11.x
        id: neo
        run: |
          V=$(curl -sSf https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml \
              | grep -oE '<version>21\.11\.[^<]+' | sed 's/<version>//' | sort -V | tail -1)
          echo "NeoForge version: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build
        id: build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build -Pneo_version=${{ steps.neo.outputs.version }} --stacktrace 2>&1 | tee build.log

      - name: Smoke test (headless server loads all mod data)
        id: smoke
        if: steps.build.outcome == 'success'
        run: |
          set +e
          timeout 600 ./gradlew runGameTestServer -Pneo_version=${{ steps.neo.outputs.version }} > server.log 2>&1
          echo "gametest server exit code: $?"
          # Any data-loading error that mentions our mod fails the job
          if grep -E "(ERROR|Exception|Failed|Couldn't|Unknown|Invalid|Missing)" server.log | grep -i retrocosmos; then
            echo "::error::Retro Cosmos data failed to load, see server.log"
            exit 1
          fi
          grep -q "Retro Cosmos: countdown initiated" server.log || { echo "::error::Mod did not load"; exit 1; }

      - name: Publish build log (for debugging)
        if: always()
        run: |
          mkdir -p /tmp/logs && cp build.log server.log /tmp/logs/ 2>/dev/null || true
          echo "status=${{ steps.build.outcome }} smoke=${{ steps.smoke.outcome }} neo=${{ steps.neo.outputs.version }} sha=${{ github.sha }}" > /tmp/logs/status.txt
          cd /tmp/logs
          git init -q -b ci-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "CI log for ${{ github.sha }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Upload jar artifact
        if: steps.smoke.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: retrocosmos-jar
          path: build/libs/*.jar

      - name: Publish GitHub release
        if: steps.smoke.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          TAG="v${VER}-build.${{ github.run_number }}"
          gh release create "$TAG" build/libs/*.jar \
            --title "Retro Cosmos ${VER} (build ${{ github.run_number }}) for Minecraft 1.21.11" \
            --notes "Automatic build for NeoForge ${{ steps.neo.outputs.version }} / Minecraft 1.21.11. Drop the jar into your \`mods\` folder." \
            --latest
